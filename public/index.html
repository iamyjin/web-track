<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebTrack — Employee Time Tracking</title>
  <meta name="description" content="Small web app for tracking employees' working time: timers with task descriptions, per-employee reports.">
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="%2312121d"/><polyline points="12 6.5 12 12 16 14" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-badge"></span>
        <span>WebTrack</span>
      </div>
      <div class="topbar-info" id="topbar-info"></div>
      <div class="topbar-actions">
        <a class="btn btn-dark" href="#/employees" id="btn-top-add"></a>
        <button class="btn btn-square" id="btn-theme" type="button" title="Toggle theme"></button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-note" id="sidebar-note"></div>
      </aside>
      <main class="view" id="view"></main>
    </div>

    <footer class="footer">
      <div class="footer-left">WebTrack&ensp;v1.0</div>
      <div class="footer-center">©2026 WebTrack&ensp;|&ensp;All rights reserved</div>
      <div class="footer-right" id="footer-right"></div>
    </footer>
  </div>

  <div class="toast" id="toast" hidden></div>
  <noscript><div style="padding:24px">This app requires JavaScript.</div></noscript>
  <script src="/app.js"></script>
</body>
</html>
